<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* กล่องสไลด์ */
#slideshow{
    position:relative;
    width:90vw;
    max-width:500px;
    height:80vh;
}

/* รูป */
#slideshow img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1s ease;
    border-radius:15px;
}

/* ปุ่มทั่วไป */
.control-btn{
    position:fixed;
    bottom:40px;
    padding:10px 20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:white;
}

/* ปุ่มก่อนหน้า */
.prev{
    left:20px;
}

/* ปุ่มถัดไป */
.next{
    right:20px;
}

/* ปุ่มไปหน้าต่อไป */
.next-page{
    left:50%;
    transform:translateX(-50%);
    opacity:0;
    transition:opacity 1s ease;
}

.next-page.show{
    opacity:1;
}
</style>
</head>

<body>

<div id="slideshow">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
    <img src="img8.jpg">
    <img src="img9.jpg">
    <img src="img10.jpg">
    <img src="img11.jpg">
    <img src="img12.jpg">
    <img src="img13.jpg">
    <img src="img14.jpg">
</div>

<button class="control-btn prev" onclick="prevImage()">⬅</button>
<button class="control-btn next" onclick="nextImage()">➡</button>

<button class="control-btn next-page" id="nextBtn" onclick="goNext()">
ไปหน้าต่อไป
</button>

<script>
const images = document.querySelectorAll("#slideshow img");
const nextBtn = document.getElementById("nextBtn");

let current = 0;
let interval;

/* 🎵 เพลง */
const bgm = new Audio("music.mp3");
bgm.loop = true;

document.addEventListener("click", () => {
    bgm.play().catch(()=>{});
}, { once:true });

function showImage(index){
    images.forEach(img => img.style.opacity = 0);
    images[index].style.opacity = 1;
}

function nextImage(){
    if(current < images.length - 1){
        current++;
        showImage(current);
    }

    if(current === images.length - 1){
        nextBtn.classList.add("show");
        clearInterval(interval);
    }
}

function prevImage(){
    if(current > 0){
        current--;
        showImage(current);
    }
}

function startSlide(){
    showImage(current);
    interval = setInterval(() => {
        if(current < images.length - 1){
            current++;
            showImage(current);
        } else {
            nextBtn.classList.add("show");
            clearInterval(interval);
        }
    }, 4000);
}

function goNext(){
    window.location.href = "p33.html";
}

startSlide();
</script>

</body>
</html>
