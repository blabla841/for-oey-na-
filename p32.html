<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* กล่องสไลด์ */
#slideshow{
    position:relative;
    width:90vw;
    max-width:500px;
    height:80vh;
}

/* รูป */
#slideshow img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 2s ease;
    border-radius:15px;
}

/* ปุ่มไปต่อ */
.next-btn{
    position:fixed;
    bottom:40px;
    padding:12px 25px;
    font-size:1rem;
    background:white;
    color:black;
    border:none;
    border-radius:30px;
    cursor:pointer;
    opacity:0;
    transition:opacity 1.5s ease;
}

.next-btn.show{
    opacity:1;
}
</style>
</head>

<body>

<div id="slideshow">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
    <img src="img8.jpg">
    <img src="img9.jpg">
    <img src="img10.jpg">
    <img src="img11.jpg">
    <img src="img12.jpg">
    <img src="img13.jpg">
    <img src="img14.jpg">
</div>

<button class="next-btn" id="nextBtn" onclick="goNext()">
    ไปหน้าต่อไป
</button>

<!-- 🎵 เพลงพื้นหลัง -->
<audio id="bgm" autoplay loop muted>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const images = document.querySelectorAll("#slideshow img");
const nextBtn = document.getElementById("nextBtn");
const bgm = document.getElementById("bgm");
let current = 0;

function showNextImage(){
    images.forEach(img => img.style.opacity = 0);
    images[current].style.opacity = 1;

    current++;

    if(current < images.length){
        setTimeout(showNextImage, 4000);
    } else {
        nextBtn.classList.add("show");
    }
}

function goNext(){
    window.location.href = "p33.html";
}

showNextImage();

/* 🔥 trick ให้ autoplay ผ่าน แล้วเปิดเสียง */
window.addEventListener("load", () => {
    bgm.muted = false;
    bgm.play().catch(() => {});
});
</script>

</body>
</html>
