<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domeflix - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Helvetica Neue', Arial, sans-serif;
}

body{
    height:100vh;
    background: radial-gradient(circle at top, #1a1a1a 0%, #000 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* โลโก้ */
.logo{
    position:absolute;
    top:20px;
    left:30px;
    color:#e50914;
    font-size:2rem;
    font-weight:bold;
}

/* กล่อง */
.login-box{
    background:rgba(0,0,0,0.75);
    padding:40px 30px;
    border-radius:8px;
    width:90%;
    max-width:350px;
    backdrop-filter: blur(5px);
}

.login-box h2{
    margin-bottom:25px;
    font-size:1.5rem;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:4px;
    background:#333;
    color:white;
    font-size:1rem;
}

input:focus{
    outline:none;
    background:#444;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:4px;
    background:#e50914;
    color:white;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff1e1e;
}

.error{
    margin-top:12px;
    color:#ff4d4d;
    font-size:0.9rem;
    text-align:center;
}

.loading{
    text-align:center;
    margin-top:12px;
    font-size:0.9rem;
    color:#ccc;
    display:none;
}

/* มือถือ */
@media(max-width:480px){
    .login-box{
        padding:30px 20px;
    }
}
</style>
</head>

<body>

<div class="logo">Domeflix</div>

<div class="login-box">
    <h2>Sign In</h2>
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button onclick="login()">Sign In</button>
    <p id="error" class="error"></p>
    <p id="loading" class="loading">กำลังเข้าสู่ระบบ...</p>
</div>

<script>
function login(){
    const correctPassword = "1604";
    const input = document.getElementById("password").value.trim();
    const errorText = document.getElementById("error");
    const loadingText = document.getElementById("loading");

    errorText.innerText = "";

    if(input === correctPassword){
        loadingText.style.display = "block";

        setTimeout(() => {
            window.location.href = "profile.html";
        }, 1000);

    }else{
        errorText.innerText = "รหัสไม่ถูกต้อง";
    }
}

/* กด Enter ได้ */
document.getElementById("password")
.addEventListener("keypress", function(event){
    if(event.key === "Enter"){
        login();
    }
});
</script>

</body>
</html>
