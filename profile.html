<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domeflix - Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Helvetica Neue', Arial, sans-serif;
}

body{
    background:#141414;
    color:white;
    text-align:center;
}

/* โลโก้ */
.logo{
    font-size:3rem;
    color:#e50914;
    margin-top:40px;
    font-weight:bold;
    letter-spacing:2px;
}

h2{
    margin-top:20px;
    font-weight:normal;
    color:#ccc;
}

/* กล่องโปรไฟล์ */
.profiles{
    display:flex;
    justify-content:center;
    gap:50px;
    margin-top:80px;
    flex-wrap:wrap;
}

/* โปรไฟล์แต่ละอัน */
.profile{
    cursor:pointer;
    transition:transform 0.3s ease;
    text-align:center;
}

.profile:hover{
    transform:scale(1.08);
}

/* กรอบรูป */
.avatar{
    width:170px;
    height:170px;
    border-radius:12px;
    overflow:hidden;
    background:#333;
    transition:all 0.3s ease;
}

/* รูป */
.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* เอฟเฟกต์ตอน hover */
.profile:hover .avatar{
    border:3px solid white;
}

/* ชื่อใต้รูป */
.profile p{
    margin-top:15px;
    font-size:1rem;
    color:#aaa;
}

.profile:hover p{
    color:white;
}

/* มือถือ */
@media(max-width:700px){
    .profiles{
        gap:25px;
    }
    .avatar{
        width:120px;
        height:120px;
    }
}
</style>
</head>

<body>

<div class="logo">DOMFLIX</div>
<h2>เลือกโปรไฟล์</h2>

<div class="profiles">

    <div class="profile" onclick="goTo('p31.html')">
        <div class="avatar">
            <img src="img1.jpg">
        </div>
        <p>Profile 1</p>
    </div>

    <div class="profile" onclick="goTo('p32.html')">
        <div class="avatar">
            <img src="img2.jpg">
        </div>
        <p>Profile 2</p>
    </div>

    <div class="profile" onclick="goTo('p33.html')">
        <div class="avatar">
            <img src="img3.jpg">
        </div>
        <p>Profile 3</p>
    </div>

    <div class="profile" onclick="goTo('p34.html')">
        <div class="avatar">
            <img src="img4.jpg">
        </div>
        <p>Profile 4</p>
    </div>

</div>

<script>
function goTo(page){
    window.location.href = page;
}
</script>

</body>
</html>
