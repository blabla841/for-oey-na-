<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Helvetica Neue', Arial, sans-serif;
}

body{
    background:black;
    color:white;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* intro */
.intro{
    position:absolute;
    z-index:3;
}

.line{
    opacity:0;
    font-size:1.6rem;
    margin:25px 0;
    transition:opacity 1.8s ease;
}

.show{
    opacity:1;
}

.start-btn{
    margin-top:40px;
    padding:12px 28px;
    background:white;
    color:black;
    border:none;
    border-radius:30px;
    cursor:pointer;
    opacity:0;
    transition:opacity 1.5s ease;
}

.start-btn.show{
    opacity:1;
}

/* video */
video{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    max-width:100%;
    max-height:100%;
    display:none;
    background:black;
    z-index:1;
}

/* question overlay */
.question{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    opacity:0;
    visibility:hidden;
    transition:opacity 1.5s ease;
    z-index:5;
}

.question.show{
    opacity:1;
    visibility:visible;
}

.form-btn{
    margin-top:30px;
    padding:12px 28px;
    background:white;
    color:black;
    border:none;
    border-radius:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="intro" id="introBox">
    <div class="line" id="l1">มีบางคำ</div>
    <div class="line" id="l2">ที่ไม่ต้องพูดออกมา</div>
    <div class="line" id="l3">แต่ก็รู้สึกได้เสมอ</div>

    <button class="start-btn" id="startBtn" onclick="startVideo()">
        กดเพื่อดู
    </button>
</div>

<video id="video" src="video.mp4" controls></video>

<div class="question" id="questionBox">
    <button class="form-btn"
        onclick="window.location.href='https://forms.gle/Y2bYzxUuu4Jg8AuC7'">
        ไปตอบคำถาม
    </button>
</div>

<script>

const lines = ["l1","l2","l3"];
const startBtn = document.getElementById("startBtn");
const video = document.getElementById("video");
const introBox = document.getElementById("introBox");
const questionBox = document.getElementById("questionBox");

lines.forEach((id, index) => {
    setTimeout(() => {
        document.getElementById(id).classList.add("show");
    }, 2000 * (index + 1));
});

setTimeout(() => {
    startBtn.classList.add("show");
}, 2000 * (lines.length + 1));

function startVideo(){
    introBox.style.display = "none";
    video.style.display = "block";
    video.play();
}

video.onended = function(){
    questionBox.classList.add("show");
};

</script>

</body>
</html>
